services:
  wsgi:
    restart: always
    build:
      context: .
      dockerfile: Dockerfile.wsgi
    platform: ${ARCH}
    image: stouch/cmd_risk_assessment:wsgi-${VERSION}
    volumes:
      - ./var:/code/var

  web:
    restart: always
    build:
      context: .
      dockerfile: Dockerfile.nginx
    platform: ${ARCH}
    image: stouch/cmd_risk_assessment:web-${VERSION}
    # ports:
    #   - "8000:80"
    depends_on:
      - wsgi

networks:
  default:
    external: true
    name: honeynet
